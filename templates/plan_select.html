{% extends "base.html" %}
{% block title %}プラン選択{% endblock %}
{% block content %}
<section class="container py-4 py-lg-5">
  <div class="wizard-head">
    <div><p class="eyebrow">Step 1</p><h1>プランを選択</h1><p>お考えのアプリに合うプランを選んでください。</p></div>
  </div>
  <form method="post" class="wizard-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="choice-grid">
      {% for plan in plans %}
      <label class="choice-card plan-choice-card">
        <input type="radio" name="plan_key" value="{{ plan.key }}" required>
        <div class="choice-visual-frame">
          <img class="package-choice-visual" src="{{ url_for('static', filename='img/plan-full-generated.png' if plan.key == 'full' else 'img/plan-simple-generated.png') }}" alt="{{ plan.name }}のイメージ">
        </div>
        <span class="choice-title">{{ plan.name }}</span>
        {% if plan.key == 'full' %}
          <div class="plan-choice-copy">
            <strong>業務の流れに合わせて、アプリを設計。</strong>
          </div>
          <div class="choice-detail">
            <strong>こんな現場におすすめ</strong>
            <ul>
              <li>独自の承認フローや権限管理が必要</li>
              <li>機能や画面を業務に合わせて設計したい</li>
              <li>変更作業やサーバー管理まで任せたい</li>
            </ul>
          </div>
          <p class="choice-example">
            利用環境：Google Cloud（当社が契約・管理）
            <span class="plan-environment-description">インターネット上でアプリを動かし、入力したデータを保存するサービスです。</span>
          </p>
        {% else %}
          <div class="plan-choice-copy">
            <strong>紙やExcelの業務を、手軽にアプリへ。</strong>
          </div>
          <div class="choice-detail">
            <strong>こんな現場におすすめ</strong>
            <ul>
              <li>日報や点検表を、まず1つアプリ化したい</li>
              <li>入力・一覧・検索などの基本機能が中心</li>
              <li>導入後の項目や選択肢を自社で変更したい</li>
            </ul>
          </div>
          <p class="choice-example">
            利用環境：Click（お客様が契約）
            <span class="plan-environment-description">コードを書かずに業務アプリを作成・運用できるツールです。</span>
          </p>
        {% endif %}
      </label>
      {% endfor %}
    </div>
    <div class="wizard-actions">
      <a class="btn btn-outline-dark" href="{{ url_for('main.index') }}">戻る</a>
      <button class="btn btn-primary btn-lg" type="submit">次へ</button>
    </div>
  </form>
</section>
{% endblock %}
